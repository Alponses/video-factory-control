name: V5 bootstrap package lock

on:
  push:
    branches:
      - video-factory-v5
    paths:
      - package.json
      - .github/workflows/v5-bootstrap-lock.yml

permissions:
  contents: write

jobs:
  package-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
        continue-on-error: true
      - name: Generate package-lock.json only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile to V5 branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current"
            exit 0
          fi
          git commit -m "build: lock V5 phase1 dependencies"
          git push origin HEAD:video-factory-v5
