name: V5 Phase 2 bootstrap lock

on:
  push:
    branches: [video-factory-v5]
    paths: ['package.json']

permissions:
  contents: write

jobs:
  package-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: video-factory-v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        run: |
          if git diff --quiet package-lock.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: lock V5 phase2 dependencies"
          git push origin HEAD:video-factory-v5
